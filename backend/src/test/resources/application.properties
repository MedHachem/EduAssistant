# Test profile: in-memory H2, fresh per test run. MySQL itself is not
# exercised by the automated test suite (no MySQL server in CI/this
# sandbox) -- see backend/README.md for how this was verified instead.
spring.datasource.url=jdbc:h2:mem:eduassistant-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
