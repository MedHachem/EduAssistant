# Optional profile for local development machines without a MySQL
# server installed. File-based H2 (not in-memory), so data survives an
# application restart just like the real MySQL profile does.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/eduassistant-local;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
