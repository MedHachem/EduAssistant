spring.application.name=eduassistant-backend
# NOT 8080: that port is already bound by an unrelated local Apache
# httpd service on at least one dev machine used for this project,
# which made the backend fail to start there while the frontend's
# proxy (frontend/proxy.conf.json) silently kept forwarding /api to
# that other server instead -- see backend/README.md's "404 regression"
# section. Keep this in sync with proxy.conf.json's /api and /ws targets.
server.port=${SERVER_PORT:8081}

# MySQL -- create the database first: CREATE DATABASE eduassistant;
# Override host/credentials via env vars in real deployments rather than editing this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eduassistant?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# First backend, no migration tool set up yet (see backend/README.md) --
# Hibernate creates/updates the schema from the entity. Revisit with
# Flyway/Liquibase once the schema needs to evolve carefully in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
